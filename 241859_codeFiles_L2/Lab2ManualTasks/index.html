<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Showcase</title>

      </div>

      <div class="card">
        <div class="avatar"></div>
        <h3 class="member-name">Abdul Hannan</h3>
        <p class="role">UI/UX Designer</p>
      </div>

      <div class="card">
        <div class="avatar"></div>
        <h3 class="member-name">Abdul Hannan Qureshi</h3>
        <p class="role">Backend Developer</p>
      </div>

    </div>

    <div class="actions d-flex flex-wrap justify-content-center gap-3">
      <button class="btn btn-outline-primary">Contact</button>
      <button class="btn btn-outline-primary">View Portfolio</button>
      <button class="btn btn-outline-primary">Share</button>
    </div>

  </section>

</body>
</html>
